name: Veracode PDF Report

# Standalone. Called once per scan: exports that scan's findings, picks up any
# sibling scan already finished for the same commit, rebuilds the combined PDF
# and updates one sticky comment. Never fails a build. See the README to wire
# it into your scan workflows.

on:
  workflow_call:
    inputs:
      scan:
        description: 'Which scan produced the results: pipeline, sca or iac'
        required: true
        type: string
      results_path:
        description: >-
          Path to the scan results file. A glob is accepted, because the
          pipeline-scan action prefixes its output (1-filtered_results.json).
        required: true
        type: string
      results_artifact:
        description: >-
          Artifact name or glob holding the results. Downloaded and merged, so
          a matrixed pipeline scan that publishes one artifact per packaged
          module is reported in full rather than one module at a time.
          e.g. 'Veracode Pipeline-Scan Results - *.zip'.
        required: false
        type: string
        default: ''
      scan_repo:
        description: 'owner/repo that was scanned, for source links and the comment'
        required: true
        type: string
      head_sha:
        description: 'Commit SHA that was scanned. Keys the report to a commit.'
        required: true
        type: string
      blob_ref:
        description: 'Branch or ref used to build source links. Falls back to head_sha.'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'Pull request number. Resolved from the commit when empty.'
        required: false
        type: string
        default: ''
      token:
        description: >-
          Token for the scanned repo, normally client_payload.token. Needs Pull
          requests: write and Contents: read there, plus Contents: write only
          if publish_branch is set. Prefer this over the comment_token secret:
          the integration already carries the right token in the dispatch
          payload.
        required: false
        type: string
        default: ''
      threshold:
        description: >-
          critical|high|medium|low|info, or a CVSS number. Marks which findings
          to prioritise; it does not gate. A stock integration has no severity
          threshold in veracode.yml, so this input is the only source unless
          you pass one in yourself.
        required: false
        type: string
        default: 'medium'
      page_size:
        description: 'a4 or letter'
        required: false
        type: string
        default: 'a4'
      include_outdated:
        description: 'SCA text reports: also include Outdated Library issues'
        required: false
        type: boolean
        default: false
      publish_branch:
        description: >-
          Optional branch in the scanned repo to commit the PDF to, so the
          comment links to a file the browser renders inline. Needs Contents:
          write on comment_token. Leave empty to link the workflow artifact
          instead. Note that this puts findings, including file paths and line
          numbers, into repository history permanently and prunes nothing.
        required: false
        type: string
        default: ''
      runs_on:
        description: >-
          JSON runner label, passed straight through to runs-on. Use
          user_config.default_runs_on so the report runs on the same runner as
          the scans, including self-hosted.
        required: false
        type: string
        default: '"ubuntu-latest"'
      retention_days:
        description: 'How long to keep the report and fragment artifacts'
        required: false
        type: number
        default: 30
    secrets:
      comment_token:
        description: >-
          Token for the scanned repo: Pull requests write to post the comment,
          Contents read to resolve source links, and Contents write only if
          publish_branch is set. Falls back to GITHUB_TOKEN when omitted.
        required: false

# No permissions block on purpose. A called workflow may not request more than
# the calling job already holds, and the integration's workflows inherit the
# repository default, which is usually contents: read only. Declaring
# 'actions: read, pull-requests: write' here made every caller fail validation.
#
# Nothing here needs elevated GITHUB_TOKEN scopes anyway. The comment and the
# source links use the dispatch token passed in as `token`. GITHUB_TOKEN is used
# only to read sibling fragment artifacts from this repo, so grant the calling
# job `actions: read` if you want the three scans to converge into one report.
# Without it each scan still reports on its own.

jobs:
  report:
    name: Build PDF report (${{ inputs.scan }})
    runs-on: ${{ fromJson(inputs.runs_on) }}
    # Serialize the report jobs for a commit. Three scans finishing at once
    # would otherwise each read "no comment yet" and post their own, and the
    # earlier ones would build from fewer fragments than the later ones.
    # Queue rather than cancel: the last to run is the one with every scan.
    concurrency:
      group: veracode-pdf-report-${{ inputs.scan_repo }}-${{ inputs.head_sha }}
      cancel-in-progress: false
    # Reporting must never break a scan pipeline.
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Check out the helper
        uses: actions/checkout@v6
        with:
          sparse-checkout: helper/cli
          sparse-checkout-cone-mode: false

      # The scans run centrally against a different repository, so the
      # workflow's own GITHUB_TOKEN cannot reach the repo being commented on.
      # Catch that here rather than after a scan has already run.
      - name: Check the token can reach the scanned repo
        env:
          SCAN_REPO: ${{ inputs.scan_repo }}
          THIS_REPO: ${{ github.repository }}
          HAS_TOKEN: ${{ (inputs.token != '' || secrets.comment_token != '') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "$SCAN_REPO" ]; then
            echo "::error::scan_repo is required."; exit 1
          fi
          if [ "$SCAN_REPO" != "$THIS_REPO" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::scan_repo is '$SCAN_REPO' but this workflow runs "\
                 "in '$THIS_REPO', and no token was supplied. "\
                 "GITHUB_TOKEN is scoped to '$THIS_REPO', so posting the "\
                 "comment and resolving source links will fail. Pass a token "\
                 "with Pull requests: write and Contents: read on "\
                 "'$SCAN_REPO', normally client_payload.token."
          fi

      - name: Confirm the helper is present
        run: |
          set -euo pipefail
          for f in veracode_report.py veracode_findings.py veracode_pdf.py; do
            test -f "helper/cli/$f" || { echo "::error::helper/cli/$f is missing"; exit 1; }
          done
          python3 --version

      # Downloading rather than passing a path keeps the two jobs independent.
      - name: Fetch the scan results
        if: inputs.results_artifact != ''
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: ${{ inputs.results_artifact }}
          merge-multiple: true
          path: scan-results

      - name: Normalize this scan's findings
        id: export
        env:
          SCAN_REPO: ${{ inputs.scan_repo }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BLOB_REF: ${{ inputs.blob_ref || inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ inputs.token || secrets.comment_token || github.token }}
          # Every caller-supplied value is passed as an environment variable and
          # never interpolated into the script body. GitHub expands ${{ }} into
          # the script text before bash parses it, so an input containing $( )
          # or a quote would otherwise execute as code in a job that holds a
          # cross-repository token.
          IN_SCAN: ${{ inputs.scan }}
          IN_RESULTS_PATH: ${{ inputs.results_path }}
          IN_RESULTS_ARTIFACT: ${{ inputs.results_artifact }}
          IN_THRESHOLD: ${{ inputs.threshold }}
          IN_INCLUDE_OUTDATED: ${{ inputs.include_outdated }}
        run: |
          set -euo pipefail
          mkdir -p fragments

          case "$IN_SCAN" in
            pipeline|sca|iac) ;;
            *) echo "::error::scan must be pipeline, sca or iac."; exit 1 ;;
          esac

          # Confine the results pattern to the workspace. It is a glob, so it
          # cannot be quoted at the point of expansion; restricting it here is
          # what stops an absolute path or a traversal reading runner state
          # into the report and its retained artifact.
          case "$IN_RESULTS_PATH" in
            /*|*..*) echo "::error::results_path must be relative to the workspace."; exit 1 ;;
            "")      echo "::error::results_path is required."; exit 1 ;;
          esac

          # Collect every non-empty match, not just the newest. The pipeline
          # scan is matrixed over packaged modules and writes one
          # <job-index>-results.json per module, so taking a single file would
          # silently drop the findings of every other module.
          RESULTS=()
          collect() {
            local pattern="$1" match
            for match in $(ls -1 -- $pattern 2>/dev/null || true); do
              [ -f "$match" ] && [ -s "$match" ] && RESULTS+=("$match")
            done
          }

          cd "$GITHUB_WORKSPACE"
          collect "$IN_RESULTS_PATH"
          [ ${#RESULTS[@]} -eq 0 ] && collect "scan-results/$IN_RESULTS_PATH"
          [ ${#RESULTS[@]} -eq 0 ] && collect "scan-results/$(basename -- "$IN_RESULTS_PATH")"

          if [ ${#RESULTS[@]} -eq 0 ]; then
            echo "::warning::No non-empty results file matched '$IN_RESULTS_PATH'."
            echo "exported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using ${#RESULTS[@]} results file(s): ${RESULTS[*]}"

          ARGS=(--mode "$IN_SCAN" --input "${RESULTS[@]}"
                --threshold "$IN_THRESHOLD"
                --out "fragments/$IN_SCAN.json")
          [ "$IN_INCLUDE_OUTDATED" = "true" ] && ARGS+=(--include-outdated)

          python3 helper/cli/veracode_report.py export "${ARGS[@]}"
          if [ -f "fragments/$IN_SCAN.json" ]; then
            echo "exported=true" >> "$GITHUB_OUTPUT"
          else
            echo "exported=false" >> "$GITHUB_OUTPUT"
          fi

      # Published before the build so a later scan can pick these up.
      - name: Publish this scan's findings
        if: steps.export.outputs.exported == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: veracode-findings-${{ inputs.head_sha }}-${{ inputs.scan }}
          path: fragments/${{ inputs.scan }}.json
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: warn
          overwrite: true

      - name: Build the combined PDF
        id: build
        env:
          SCAN_REPO: ${{ inputs.scan_repo }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BLOB_REF: ${{ inputs.blob_ref || inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          # Sibling fragments come from the repo running this workflow.
          ARTIFACT_REPO: ${{ github.repository }}
          ARTIFACT_TOKEN: ${{ github.token }}
          # The comment and source links target the scanned repo.
          GH_TOKEN: ${{ inputs.token || secrets.comment_token || github.token }}
          IN_PAGE_SIZE: ${{ inputs.page_size }}
          IN_PUBLISH_BRANCH: ${{ inputs.publish_branch }}
        run: |
          set -euo pipefail
          case "$IN_PAGE_SIZE" in
            a4|letter) ;;
            *) echo "::error::page_size must be a4 or letter."; exit 1 ;;
          esac

          ARGS=(--fragments fragments --collect
                --out veracode-security-report.pdf
                --page-size "$IN_PAGE_SIZE"
                --artifact-name "veracode-security-report-$HEAD_SHA")
          [ -n "$IN_PUBLISH_BRANCH" ] && ARGS+=(--publish-branch "$IN_PUBLISH_BRANCH")

          python3 helper/cli/veracode_report.py build "${ARGS[@]}"
          if [ -f veracode-security-report.pdf ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the report
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: veracode-security-report-${{ inputs.head_sha }}
          path: veracode-security-report.pdf
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: warn
          overwrite: true

      # Separate step so the artifact exists when its link is resolved.
      - name: Post the report comment
        if: steps.build.outputs.built == 'true'
        env:
          SCAN_REPO: ${{ inputs.scan_repo }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ARTIFACT_REPO: ${{ github.repository }}
          ARTIFACT_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ inputs.token || secrets.comment_token || github.token }}
        run: |
          set -euo pipefail
          python3 helper/cli/veracode_report.py comment \
            --fragments fragments \
            --artifact-name "veracode-security-report-$HEAD_SHA"
