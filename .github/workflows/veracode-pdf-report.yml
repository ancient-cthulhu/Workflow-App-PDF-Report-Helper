name: Veracode PDF Report

# Standalone. Called once per scan: exports that scan's findings, picks up any
# sibling scan already finished for the same commit, rebuilds the combined PDF
# and updates one sticky comment. Never fails a build. See the README to wire
# it into your scan workflows.

on:
  workflow_call:
    inputs:
      scan:
        description: 'Which scan produced the results: pipeline, sca or iac'
        required: true
        type: string
      results_path:
        description: >-
          Path to the scan results file. A glob is accepted, because the
          pipeline-scan action prefixes its output (1-filtered_results.json).
        required: true
        type: string
      results_artifact:
        description: >-
          Deprecated and ignored. Every artifact in the run is downloaded, so
          no artifact name has to be guessed. Safe to leave set or remove.
        required: false
        type: string
        default: ''
      scan_repo:
        description: 'owner/repo that was scanned, for source links and the comment'
        required: true
        type: string
      head_sha:
        description: 'Commit SHA that was scanned. Keys the report to a commit.'
        required: true
        type: string
      blob_ref:
        description: 'Branch or ref used to build source links. Falls back to head_sha.'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'Pull request number. Resolved from the commit when empty.'
        required: false
        type: string
        default: ''
      token:
        description: >-
          Token for the scanned repo, normally client_payload.token. Needs Pull
          requests: write and Contents: read there, plus Contents: write only
          if publish_branch is set. Prefer this over the comment_token secret:
          the integration already carries the right token in the dispatch
          payload.
        required: false
        type: string
        default: ''
      threshold:
        description: >-
          critical|high|medium|low|info, or a CVSS number. Marks which findings
          to prioritise; it does not gate. A stock integration has no severity
          threshold in veracode.yml, so this input is the only source unless
          you pass one in yourself.
        required: false
        type: string
        default: 'medium'
      page_size:
        description: 'a4 or letter'
        required: false
        type: string
        default: 'a4'
      include_outdated:
        description: 'SCA text reports: also include Outdated Library issues'
        required: false
        type: boolean
        default: false
      publish_branch:
        description: >-
          Optional branch in the scanned repo to commit the PDF to, so the
          comment links to a file the browser renders inline. Needs Contents:
          write on comment_token. Leave empty to link the workflow artifact
          instead. Note that this puts findings, including file paths and line
          numbers, into repository history permanently and prunes nothing.
        required: false
        type: string
        default: ''
      runs_on:
        description: >-
          JSON runner label, passed straight through to runs-on. Use
          user_config.default_runs_on so the report runs on the same runner as
          the scans, including self-hosted.
        required: false
        type: string
        default: '"ubuntu-latest"'
      pdf_report:
        description: >-
          Wire to client_payload.user_config.pdf_report. The Veracode app
          flattens the scanned repo's veracode.yml section for this scan into
          user_config, so this is the same route every other setting takes.
          Empty means fall back to reading veracode.yml directly.
        required: false
        type: string
        default: ''
      config_file:
        description: >-
          Config file consulted for the pdf_report toggle, in both this repo
          and the scanned repo.
        required: false
        type: string
        default: 'veracode.yml'
      retention_days:
        description: 'How long to keep the report and fragment artifacts'
        required: false
        type: number
        default: 30
    secrets:
      comment_token:
        description: >-
          Token for the scanned repo: Pull requests write to post the comment,
          Contents read to resolve source links, and Contents write only if
          publish_branch is set. Falls back to GITHUB_TOKEN when omitted.
        required: false

# No permissions block on purpose. A called workflow may not request more than
# the calling job already holds, and the integration's workflows inherit the
# repository default, which is usually contents: read only. Declaring
# 'actions: read, pull-requests: write' here made every caller fail validation.
#
# Nothing here needs elevated GITHUB_TOKEN scopes anyway. The comment and the
# source links use the dispatch token passed in as `token`. GITHUB_TOKEN is used
# only to read sibling fragment artifacts from this repo, so grant the calling
# job `actions: read` if you want the three scans to converge into one report.
# Without it each scan still reports on its own.

jobs:
  # Decides whether to report at all, before anything is downloaded. Its own
  # job so a disabled scan skips visibly instead of running steps that do
  # nothing.
  gate:
    name: Check the report is enabled (${{ inputs.scan }})
    runs-on: ${{ fromJson(inputs.runs_on) }}
    continue-on-error: true
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            helper/cli
            ${{ inputs.config_file }}
          sparse-checkout-cone-mode: false

      - id: gate
        env:
          SCAN_REPO: ${{ inputs.scan_repo }}
          BLOB_REF: ${{ inputs.blob_ref || inputs.head_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          GH_TOKEN: ${{ inputs.token || secrets.comment_token || github.token }}
          CONFIG_FILE: ${{ inputs.config_file }}
          PDF_REPORT: ${{ inputs.pdf_report }}
          IN_SCAN: ${{ inputs.scan }}
          IN_CONFIG: ${{ inputs.config_file }}
        run: |
          set -euo pipefail
          case "$IN_SCAN" in
            pipeline|sca|iac) ;;
            *) echo "::error::scan must be pipeline, sca or iac."; exit 1 ;;
          esac
          python3 helper/cli/veracode_report.py enabled \
            --scan "$IN_SCAN" --config "$IN_CONFIG"

  report:
    needs: [gate]
    if: needs.gate.outputs.enabled != 'false'
    name: Build PDF report (${{ inputs.scan }})
    runs-on: ${{ fromJson(inputs.runs_on) }}
    # Serialize the report jobs for a commit. Three scans finishing at once
    # would otherwise each read "no comment yet" and post their own, and the
    # earlier ones would build from fewer fragments than the later ones.
    # Queue rather than cancel: the last to run is the one with every scan.
    concurrency:
      group: veracode-pdf-report-${{ inputs.scan_repo }}-${{ inputs.head_sha }}
      cancel-in-progress: false
    # Reporting must never break a scan pipeline.
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Check out the helper
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            helper/cli
            ${{ inputs.config_file }}
          sparse-checkout-cone-mode: false

      # The scans run centrally against a different repository, so the
      # workflow's own GITHUB_TOKEN cannot reach the repo being commented on.
      # Catch that here rather than after a scan has already run.
      - name: Check the token can reach the scanned repo
        env:
          SCAN_REPO: ${{ inputs.scan_repo }}
          THIS_REPO: ${{ github.repository }}
          HAS_TOKEN: ${{ (inputs.token != '' || secrets.comment_token != '') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "$SCAN_REPO" ]; then
            echo "::error::scan_repo is required."; exit 1
          fi
          if [ "$SCAN_REPO" != "$THIS_REPO" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::scan_repo is '$SCAN_REPO' but this workflow runs "\
                 "in '$THIS_REPO', and no token was supplied. "\
                 "GITHUB_TOKEN is scoped to '$THIS_REPO', so posting the "\
                 "comment and resolving source links will fail. Pass a token "\
                 "with Pull requests: write and Contents: read on "\
                 "'$SCAN_REPO', normally client_payload.token."
          fi

      - name: Confirm the helper is present and self-consistent
        run: |
          set -euo pipefail
          for f in veracode_report.py veracode_findings.py veracode_pdf.py; do
            test -f "helper/cli/$f" || { echo "::error::helper/cli/$f is missing"; exit 1; }
          done
          python3 --version
          # Reports a version mismatch between the three files, which is the
          # usual result of copying an update in piecemeal.
          python3 helper/cli/veracode_report.py --version

      # Downloading rather than passing a path keeps the two jobs independent.
      # Every artifact this run produced, unconditionally. No name, no
      # pattern, no extension assumptions.
      #
      # This used to download a caller-supplied artifact pattern. A Java repo
      # publishes 'Veracode Pipeline-Scan Results - verademo.war' next to a
      # '...-js-no-pm.zip', so a pattern ending in '.zip' fetched only the
      # module with no findings and the report announced SAST as clean. Any
      # scheme that has to guess an artifact name can fail that way, and it
      # fails silently, which is the one outcome this tool must not have.
      - name: Fetch this run's artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          path: scan-artifacts

      - name: Locate the results
        id: locate
        env:
          IN_RESULTS_PATH: ${{ inputs.results_path }}
          IN_SCAN: ${{ inputs.scan }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          case "$IN_RESULTS_PATH" in
            /*|*..*) echo "::error::results_path must be relative."; exit 1 ;;
            "")      echo "::error::results_path is required."; exit 1 ;;
          esac
          NAME="$(basename -- "$IN_RESULTS_PATH")"
          echo "Artifacts downloaded:"
          find scan-artifacts -maxdepth 1 -mindepth 1 -type d 2>/dev/null \
            | sed 's#scan-artifacts/#  #' || echo "  (none)"
          COUNT="$(find . -type f -name "$NAME" -size +0c 2>/dev/null | wc -l)"
          echo "Files named '$NAME': $COUNT"
          find . -type f -name "$NAME" -size +0c 2>/dev/null | sed 's/^/  /'
          echo "found=$COUNT" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(printf '%.8s' "${HEAD_SHA:-unknown}")" >> "$GITHUB_OUTPUT"

      - name: Normalize this scan's findings
        id: export
        env:
          SCAN_REPO: ${{ inputs.scan_repo }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BLOB_REF: ${{ inputs.blob_ref || inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ inputs.token || secrets.comment_token || github.token }}
          IN_SCAN: ${{ inputs.scan }}
          IN_RESULTS_PATH: ${{ inputs.results_path }}
          IN_THRESHOLD: ${{ inputs.threshold }}
          IN_INCLUDE_OUTDATED: ${{ inputs.include_outdated }}
        run: |
          set -euo pipefail
          mkdir -p fragments
          case "$IN_SCAN" in
            pipeline|sca|iac) ;;
            *) echo "::error::scan must be pipeline, sca or iac."; exit 1 ;;
          esac

          NAME="$(basename -- "$IN_RESULTS_PATH")"
          RESULTS=()
          while IFS= read -r f; do
            [ -n "$f" ] && RESULTS+=("$f")
          done < <(find . -type f -name "$NAME" -size +0c 2>/dev/null | sort)

          if [ ${#RESULTS[@]} -eq 0 ]; then
            echo "::warning::No non-empty file named '$NAME' anywhere in the workspace."
            echo "Files that were available:"
            find . -type f \( -name '*results*.json' -o -name '*.txt' \) \
              2>/dev/null | head -40 | sed 's/^/  /'
            echo "exported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using ${#RESULTS[@]} results file(s):"
          printf '  %s\n' "${RESULTS[@]}"

          # The pipeline scan is matrixed: each leg writes <index>-results.json
          # and <index>-filtered_results.json. The filtered files therefore
          # enumerate the legs that ran. If a leg's results file is missing, the
          # scan is reported as not run rather than as clean, because reporting
          # one module of several as the whole SAST result is how a repo with
          # real findings ends up displayed as passing.
          if [ "$IN_SCAN" = "pipeline" ]; then
            LEGS="$(find . -type f -name '*-filtered_results.json' 2>/dev/null \
                    | sed 's#.*/##; s#-filtered_results\.json$##' \
                    | grep -E '^[0-9]+$' | sort -u || true)"
            GOT="$(printf '%s\n' "${RESULTS[@]}" \
                   | sed 's#.*/##; s#-results\.json$##' \
                   | grep -E '^[0-9]+$' | sort -u || true)"
            if [ -n "$LEGS" ]; then
              MISSING="$(comm -23 <(echo "$LEGS") <(echo "$GOT") | tr '\n' ' ')"
              if [ -n "${MISSING// /}" ]; then
                echo "::warning::The pipeline scan ran $(echo "$LEGS" | wc -w) module(s) but results for module index(es) ${MISSING}are missing, so this report would cover only part of the scan. Marking SAST as not reported instead of clean. Widen results_artifact: a packaged module keeps its own extension, so '.war' and '.jar' modules are excluded by a pattern ending in '.zip'."
                echo "exported=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          ARGS=(--mode "$IN_SCAN" --input "${RESULTS[@]}"
                --threshold "$IN_THRESHOLD"
                --out "fragments/$IN_SCAN.json")
          [ "$IN_INCLUDE_OUTDATED" = "true" ] && ARGS+=(--include-outdated)

          python3 helper/cli/veracode_report.py export "${ARGS[@]}"
          if [ -f "fragments/$IN_SCAN.json" ]; then
            echo "exported=true" >> "$GITHUB_OUTPUT"
          else
            echo "exported=false" >> "$GITHUB_OUTPUT"
          fi

      # Published before the build so a later scan can pick these up.
      - name: Publish this scan's findings
        if: steps.export.outputs.exported == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: veracode-findings-${{ steps.locate.outputs.short_sha }}-${{ inputs.scan }}
          path: fragments/${{ inputs.scan }}.json
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: warn
          overwrite: true

      - name: Build the combined PDF
        id: build
        env:
          SCAN_REPO: ${{ inputs.scan_repo }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BLOB_REF: ${{ inputs.blob_ref || inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          # Sibling fragments come from the repo running this workflow.
          ARTIFACT_REPO: ${{ github.repository }}
          ARTIFACT_TOKEN: ${{ github.token }}
          # The comment and source links target the scanned repo.
          GH_TOKEN: ${{ inputs.token || secrets.comment_token || github.token }}
          SHORT_SHA: ${{ steps.locate.outputs.short_sha }}
          IN_PAGE_SIZE: ${{ inputs.page_size }}
          IN_PUBLISH_BRANCH: ${{ inputs.publish_branch }}
        run: |
          set -euo pipefail
          case "$IN_PAGE_SIZE" in
            a4|letter) ;;
            *) echo "::error::page_size must be a4 or letter."; exit 1 ;;
          esac

          ARGS=(--fragments fragments --collect
                --out "veracode-report-$SHORT_SHA.pdf"
                --page-size "$IN_PAGE_SIZE"
                --artifact-name "veracode-report-$SHORT_SHA")
          [ -n "$IN_PUBLISH_BRANCH" ] && ARGS+=(--publish-branch "$IN_PUBLISH_BRANCH")

          python3 helper/cli/veracode_report.py build "${ARGS[@]}"
          if [ -f "veracode-report-$SHORT_SHA.pdf" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the report
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: veracode-report-${{ steps.locate.outputs.short_sha }}
          path: veracode-report-*.pdf
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: warn
          overwrite: true

      # Separate step so the artifact exists when its link is resolved.
      - name: Post the report comment
        if: steps.build.outputs.built == 'true'
        env:
          SCAN_REPO: ${{ inputs.scan_repo }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ARTIFACT_REPO: ${{ github.repository }}
          ARTIFACT_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ inputs.token || secrets.comment_token || github.token }}
          SHORT_SHA: ${{ steps.locate.outputs.short_sha }}
        run: |
          set -euo pipefail
          python3 helper/cli/veracode_report.py comment \
            --fragments fragments \
            --artifact-name "veracode-report-$SHORT_SHA"
